services:
  ai-studios:
    build: .
    container_name: ai-studios
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Set to http://qc:8001 and start with `--profile qc` to enable the
      # product-size and face-identity checks. Empty hides the ML controls.
      - ML_QC_URL=${ML_QC_URL:-}
      - QC_API_TOKEN=${QC_API_TOKEN:-}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/studio/image"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  qc:
    profiles: ["qc"]
    build: ./services/qc
    container_name: ai-studios-qc
    environment:
      - QC_API_TOKEN=${QC_API_TOKEN:-}
      - QC_IDENTITY_THRESHOLD=${QC_IDENTITY_THRESHOLD:-0.52}
      - QC_SIZE_TOLERANCE=${QC_SIZE_TOLERANCE:-0.2}
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
