[project]
name = "ai-studios-qc"
version = "1.0.0"
description = "AI Studios ML QC service — YuNet face detection, SFace face identity, product-size measurement"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.5",
    "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
