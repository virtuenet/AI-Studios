version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # TypeScript 7 is not supported by typescript-eslint yet. Keep it on the
    # TS 6 API until the lint stack catches up; majors otherwise arrive as
    # individual PRs so they can be tested in isolation.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /services/qc
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/qc
    schedule:
      interval: weekly
