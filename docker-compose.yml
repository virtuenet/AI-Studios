# ─────────────────────────────────────────────────────────────
# AI Studios — SaaS multi-service deployment
# ─────────────────────────────────────────────────────────────
#
# Usage:
#   docker compose up -d                  # app + postgres + redis
#   docker compose --profile worker up -d # add the generation worker
#   docker compose --profile qc up -d     # add the ML QC service
#
# The app auto-migrates the database on startup when DATABASE_URL
# is set. Redis is used by the worker (BullMQ) and for rate-limiting.

services:
  # ── Next.js web application ──────────────────────────────────
  app:
    build: .
    container_name: ai-studios-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgres://ai-studios:${DB_PASSWORD:-dev-password}@postgres:5432/ai-studios
      - REDIS_URL=redis://redis:6379
      - AUTH_MODE=${AUTH_MODE:-byok}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - MUAPI_API_KEY=${MUAPI_API_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - ML_QC_URL=${ML_QC_URL:-}
      - QC_API_TOKEN=${QC_API_TOKEN:-}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ── Generation worker (BullMQ) ───────────────────────────────
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ai-studios-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://ai-studios:${DB_PASSWORD:-dev-password}@postgres:5432/ai-studios
      - REDIS_URL=redis://redis:6379
      - MUAPI_API_KEY=${MUAPI_API_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    init: true
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-studios-postgres
    environment:
      - POSTGRES_USER=ai-studios
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dev-password}
      - POSTGRES_DB=ai-studios
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai-studios"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis (rate limiting + BullMQ) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-studios-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── ML QC service (optional) ─────────────────────────────────
  qc:
    profiles: ["qc"]
    build: ./services/qc
    container_name: ai-studios-qc
    environment:
      - QC_API_TOKEN=${QC_API_TOKEN:-}
      - QC_IDENTITY_THRESHOLD=${QC_IDENTITY_THRESHOLD:-0.52}
      - QC_SIZE_TOLERANCE=${QC_SIZE_TOLERANCE:-0.2}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
  redis_data:
