name: Update submodules

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update submodules to latest tracked branches
        run: git submodule update --remote --merge
      - name: Open or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-submodules
          title: 'chore: update git submodules'
          commit-message: 'chore: update git submodules'
          body: |
            Automated weekly submodule sync. Review upstream changes and CI before merging.
          labels: dependencies
