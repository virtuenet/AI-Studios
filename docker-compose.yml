services:
  ai-studios:
    build: .
    container_name: ai-studios
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/studio/image"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
